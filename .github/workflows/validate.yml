name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # home-assistant/actions, master on 19 Nov 2026
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # hacs/action, main on 8 Jun 2026
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
